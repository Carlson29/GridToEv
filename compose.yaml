services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      GRIDTOEV_API_KEY: "${GRIDTOEV_API_KEY:-}"
      GRIDTOEV_CORS_ORIGINS: "${GRIDTOEV_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
