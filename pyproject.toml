[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "gridtoev"
version = "1.0.0"
description = "Dispatch-down forecasting and prediction API for Hack the Climate 2026"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "joblib==1.6.0",
  "numpy==2.3.5",
  "pandas==3.0.1",
  "scikit-learn==1.9.1",
  "uvicorn[standard]==0.53.0",
]

[project.optional-dependencies]
notebook = [
  "ipykernel==6.29.5",
  "jupyterlab==4.4.10",
  "nbclient==0.10.2",
  "nbformat==5.10.4",
  "openpyxl==3.1.5",
]
test = ["httpx==0.28.1"]

[project.scripts]
gridtoev-benchmark = "gridtoev.benchmarking:main"
gridtoev-train = "gridtoev.training:main"

[tool.setuptools.packages.find]
where = ["src"]
