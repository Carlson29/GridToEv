services:
  - type: web
    name: gridtoev-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: GRIDTOEV_API_KEY
        sync: false
      - key: GRIDTOEV_CORS_ORIGINS
        sync: false
      - key: GRIDTOEV_DAILY_MODEL_PATH
        value: "/app/models/v2/daily_curtailment_bundle.joblib"
      - key: GRIDTOEV_DAILY_DATASET_PATH
        value: "/app/data/processed/daily_curtailment_forecast_v2.csv.gz"
